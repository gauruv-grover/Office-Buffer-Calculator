<div class="container">

    <div class="card upload-card">
        <h1>Office Buffer Calculator</h1>

        <input type="file"
               id="excelFile"
               accept=".xlsx,.xls">
    </div>

    <div class="card hidden" id="dashboardCard">

        <div class="metrics">

            <div class="metric">
                <h3>Total Deviation (Minutes)</h3>
                <p id="totalDeviation">0 min</p>
            </div>

            <div class="metric">
                <h3>Remaining Buffer Time (Minutes)</h3>
                <p id="remainingBuffer">90 min</p>
            </div>

            <div class="metric">
                <h3>Buffer Count Used (Days)</h3>
                <p id="bufferUsed">0 days</p>
            </div>

            <div class="metric">
                <h3>Remaining Buffer Count (Days)</h3>
                <p id="bufferRemaining">10 days</p>
            </div>

            <div class="metric">
                <h3>Maximum Buffer Taken (Minutes)</h3>
                <p id="maxBuffer">0 min</p>
            </div>

        </div>

    </div>

</div>
