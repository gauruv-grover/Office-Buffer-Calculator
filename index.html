<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buffer Calculator</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;padding:20px}.card{background:#fff;padding:20px;border-radius:8px;margin-bottom:16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px}th{background:#1f4e79;color:#fff}</style></head><body><div class="card"><h1>Buffer Calculator</h1><input type="file" id="excelFile" accept=".xlsx,.xls"></div><div class="card"><p>Total Deviation: <span id="totalDeviation">0</span></p><p>Remaining Buffer Time: <span id="remainingBuffer">90</span></p><p>Buffer Count Used: <span id="bufferUsed">0</span></p><p>Remaining Buffer Count: <span id="bufferRemaining">10</span></p><p>Max Buffer Taken: <span id="maxBuffer">0</span></p></div><div class="card"><table><thead><tr><th>Row</th><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Duration (M)</th><th>Deviation (N)</th></tr></thead><tbody id="tb"></tbody></table></div><script>function excelTimeToMinutes(v){if(v==null||v==='')return null;if(typeof v==='number')return Math.round(v*24*60);let p=v.toString().split(':');if(p.length<2)return null;return parseInt(p[0])*60+parseInt(p[1]);}document.getElementById('excelFile').addEventListener('change',e=>{const f=e.target.files[0];const r=new FileReader();r.onload=x=>{const wb=XLSX.read(new Uint8Array(x.target.result),{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{header:1});calc(rows);};r.readAsArrayBuffer(f);});function calc(rows){let total=0,count=0,max=0;tb.innerHTML='';for(let i=1;i<rows.length;i++){const row=rows[i]||[];let a=excelTimeToMinutes(row[6]),b=excelTimeToMinutes(row[7]);if(a==null||b==null)continue;if(b<a)b+=1440;let dur=Number(((b-a)/60).toFixed(2));let dev=0;if(dur<9&&dur>=8.5)dev=Number(((9-dur)*60).toFixed(2));total+=dev;if(dev>0)count++;if(dev>max)max=dev;tb.innerHTML+=`<tr><td>${i+1}</td><td>${row[0]||''}</td><td>${row[6]||''}</td><td>${row[7]||''}</td><td>${dur}</td><td>${dev}</td></tr>`;}document.getElementById('totalDeviation').textContent=total.toFixed(2);document.getElementById('remainingBuffer').textContent=(90-total).toFixed(2);document.getElementById('bufferUsed').textContent=count;document.getElementById('bufferRemaining').textContent=10-count;document.getElementById('maxBuffer').textContent=max.toFixed(2);}</script></body></html>
